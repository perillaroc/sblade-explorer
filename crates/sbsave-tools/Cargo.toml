[package]
name = "sbsave-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "sbsave_tools"
path = "src/lib.rs"

[[bin]]
name = "sbsave-tools"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }
walkdir = { workspace = true }
