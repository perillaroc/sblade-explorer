[project]
name = "sblade-tools"
version = "0.1.0"
description = "Stellar Blade 存档分析数据管线（构建期 Python 工具）"
license = "Apache-2.0"
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
