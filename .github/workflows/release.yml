name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的 tag（如 v0.2.0）
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  verify:
    # Runs the full CI gate (fmt / clippy / test / frontend) before shipping.
    uses: ./.github/workflows/ci.yml

  publish:
    name: 构建并发布（Windows）
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A manual run must build the tagged tree, not the branch tip.
          ref: ${{ inputs.tag || github.ref }}
      - name: 校验 tag 与版本号一致
        shell: pwsh
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:TAG -ne "v$version") {
            throw "tag $env:TAG 与 tauri.conf.json 版本 $version 不一致，请先在 apps/desktop 运行 pnpm bump $version"
          }
          "APP_TAG=$env:TAG" >> $env:GITHUB_ENV
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml
      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: 安装前端依赖
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: 构建桌面应用（便携版，不打包安装器）
        working-directory: apps/desktop
        run: pnpm tauri build --no-bundle
      - name: 构建 CLI
        run: cargo build --release -p sbsave-cli
      - name: 打包 zip
        shell: pwsh
        run: |
          $suffix = "$env:APP_TAG-x86_64-pc-windows-msvc"
          Compress-Archive -Path target/release/sblade-explorer.exe -DestinationPath "sblade-explorer-$suffix.zip"
          Compress-Archive -Path target/release/sbsave.exe -DestinationPath "sbsave-$suffix.zip"
      - name: 创建或更新 draft Release
        shell: pwsh
        run: |
          $tag = $env:APP_TAG
          $assets = "sblade-explorer-$tag-x86_64-pc-windows-msvc.zip", "sbsave-$tag-x86_64-pc-windows-msvc.zip"
          $notes = "Windows 便携版：解压后直接运行 sblade-explorer.exe（需要系统已安装 WebView2 运行时，Windows 10/11 通常自带）。CLI：解压 sbsave zip 后运行 sbsave.exe，用法见 README。"
          $releaseExists = & {
            $ErrorActionPreference = 'Continue'
            gh release view $tag 2>$null | Out-Null
            $LASTEXITCODE -eq 0
          }
          if ($releaseExists) {
            gh release upload $tag $assets --clobber
          } else {
            gh release create $tag --draft --title "剑星存档分析 $tag" --generate-notes --notes $notes $assets
          }