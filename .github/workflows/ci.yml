name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Reused by release.yml so a release only ships a tree that passes the gates.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust（Windows）
    # Windows only: the sbsave-tools integration test compares the regenerated
    # data/catalog.json byte for byte, and generation uses platform newlines.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: 格式检查
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 测试
        run: cargo test --workspace
      - name: CLI 冒烟
        run: |
          cargo run -p sbsave-cli -- --version
          cargo run -p sbsave-cli -- catalog check

  frontend:
    name: 前端
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml
      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查与构建
        run: pnpm build