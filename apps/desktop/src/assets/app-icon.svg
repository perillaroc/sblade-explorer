<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1024 1024"
  width="1024"
  height="1024"
  role="img"
  aria-label="sblade-explorer"
>
  <title>sblade-explorer（剑星存档分析）</title>
  <!--
    应用图标 master（1024×1024，四角透明）。
    字形取自 Lucide `sword`（ISC 许可，https://lucide.dev/icons/sword），
    许可声明与重新生成方式见 apps/desktop/src-tauri/icons/README.md。
    生成图标：cd apps/desktop && pnpm icon
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312E81" />
      <stop offset="1" stop-color="#7C3AED" />
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 圆角方底：内缩 6%，半径 25%，深靛 → 紫渐变 -->
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#bg)" />
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#glow)" />
  <rect
    x="64"
    y="64"
    width="896"
    height="896"
    rx="224"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.12"
    stroke-width="8"
  />

  <!--
    Lucide `sword`：四段 path，字形 bbox 为 x/y 3–21（中心 12,12）；
    缩放到画布 60%，描边 3（默认 2 在 16/32px 会糊），圆头圆角。
  -->
  <g
    transform="translate(512 512) scale(31) translate(-12 -12)"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="m11 19-6-6" />
    <path d="m5 21-2-2" />
    <path d="m8 16-4 4" />
    <path d="M9.5 17.5 20.414 6.586A2 2 0 0021 5.172V3h-2.172a2 2 0 00-1.414.586L6.5 14.5" />
  </g>
</svg>
